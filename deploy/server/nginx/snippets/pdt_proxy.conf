# Snippet incluído pelas locations / e /ws/ em pdt.conf.
# Centraliza headers do proxy. Atrás de Cloudflare Tunnel, cloudflared envia
# X-Forwarded-Proto e CF-Connecting-IP; $pdt_forwarded_proto vem do map no template.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $pdt_forwarded_proto;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
proxy_redirect    off;
proxy_buffering   off;
